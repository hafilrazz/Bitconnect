name: netless
description: Bitconnect — offline BLE mesh chat + worldwide E2E DMs.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  mesh_protocol:
    path: ../../packages/mesh_protocol
  mesh_transport:
    path: ../../packages/mesh_transport
  mesh_ble:
    path: ../../packages/mesh_ble
  mesh_internet:
    path: ../../packages/mesh_internet
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  # Camera stream + QR-only decode for contact IDs
  camera: ^0.11.0
  google_mlkit_barcode_scanning: ^0.13.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_logo.png
